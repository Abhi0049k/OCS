[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocs"
version = "0.1.0"
authors = [
  { name="OCS Team", email="team@ocs-ai.com" },
]
description = "OCS - AI-Powered Landing Page Builder for creating unique, high-quality landing pages"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["ai", "landing-page", "web-design", "automation", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "google-generativeai>=0.3.0",
    "jinja2>=3.1.0",
    "pathlib",
    "typing-extensions>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/Abhi0049k/OCS"
Repository = "https://github.com/Abhi0049k/OCS.git"
Issues = "https://github.com/Abhi0049k/OCS/issues"
Documentation = "https://github.com/Abhi0049k/OCS#readme"

[project.scripts]
ocs = "src.ocs.main:main"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
